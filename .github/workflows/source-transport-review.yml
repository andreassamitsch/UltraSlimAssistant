name: Samsung transport and shared source review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review transport and compare source component hashes
        env:
          PCLOUD_SOURCE_LINK: ${{ secrets.PCLOUD_SOURCE_LINK }}
          PCLOUD_Q990D_SOURCE_LINK: ${{ secrets.PCLOUD_Q990D_SOURCE_LINK }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/transport.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 tools/source_transport_review.py "$work"
