name: Assist prototype tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/assist-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Native capability probe host test (stub only)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Itests/native_stub prototype/tizen/capability_probe.c tests/native_stub/test_probe.c -o "$RUNNER_TEMP/test-probe"
          "$RUNNER_TEMP/test-probe"
