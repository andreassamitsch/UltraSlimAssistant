name: Samsung kernel and audio platform review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review selected kernel and media source
        env:
          PCLOUD_SOURCE_LINK: ${{ secrets.PCLOUD_SOURCE_LINK }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/platform.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 tools/source_platform.py "$work"
