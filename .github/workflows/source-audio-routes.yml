name: Samsung MT8532 capture route trace
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trace released ALSA route definitions
        env:
          PCLOUD_SOURCE_LINK: ${{ secrets.PCLOUD_SOURCE_LINK }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/audio-routes.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 tools/source_audio_routes.py "$work"
