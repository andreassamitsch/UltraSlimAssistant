name: Samsung MT8532 capture route trace
on:
  push:
    paths:
      - '.github/workflows/source-audio-routes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trace released ALSA route definitions
        env:
          PCLOUD_SOURCE_LINK: 'https://e.pcloud.link/publink/show?code=XZEEGV7ZURQ2dQmRaIQLpQpsrEj49mcSL7tV'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/audio-routes.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 tools/source_audio_routes.py "$work"
