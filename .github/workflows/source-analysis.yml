name: Samsung open-source analysis
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/source_analysis.py'
      - '.github/workflows/source-analysis.yml'
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/source_analysis.py --self-test
  analyze:
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and inspect public Samsung source (temporary only)
        env:
          PCLOUD_SOURCE_LINK: 'https://e.pcloud.link/publink/show?code=XZEEGV7ZURQ2dQmRaIQLpQpsrEj49mcSL7tV'
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/samsung-source.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 tools/source_analysis.py --work "$work"
