name: Samsung MediaTek and AV source review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review selected media and SDK source
        env:
          PCLOUD_SOURCE_LINK: ${{ secrets.PCLOUD_SOURCE_LINK }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/samsung-focus.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          python3 tools/source_focus.py "$work"
